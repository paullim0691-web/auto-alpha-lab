name: AutoAlphaLab Autonomous Daily Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '45 21 * * 1-5' # 미국 정규장 마감 후 자동 실행 (한국시간 화~토 06:45)

permissions:
  contents: write

jobs:
  run-autonomous-quant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run Phase 2 Autonomous System
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python run_phase2.py
      - name: Commit Dashboard & Status Snapshot
        run: |
          git config user.name "AutoAlphaBot"
          git config user.email "bot@auto-alpha-lab.local"
          git add docs/status.json README.md
          git diff --cached --quiet || git commit -m "chore: autonomous daily update [skip ci]"
          git push
